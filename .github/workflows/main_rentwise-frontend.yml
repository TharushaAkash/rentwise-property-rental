name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'RentWise-Frontend/**'
      - '.github/workflows/main_rentwise-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./RentWise-Frontend
        run: npm ci

      - name: Build Project
        working-directory: ./RentWise-Frontend
        run: npm run build
        env:
          VITE_API_URL: 'https://rentwise-api-v2-athfc8b8g7c2ahfc.eastasia-01.azurewebsites.net/api'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy RentWise-Frontend/dist --project-name=rentwiselk --commit-dirty=true
